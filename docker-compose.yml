services:
  huntly:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: huntly
    restart: unless-stopped
    ports:
      # Access the application at http://localhost:1420
      - "${WEB_PORT:-1420}:7842"
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=7842
      - DATABASE_PATH=/app/data/huntly.db
      - CLIENT_DIST_PATH=/app/apps/desktop/dist
      - PLAYWRIGHT_HEADLESS=${PLAYWRIGHT_HEADLESS:-true}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
      - SEARCH_PROVIDER=${SEARCH_PROVIDER:-auto}
      - SERPER_API_KEY=${SERPER_API_KEY:-}
      - SERPAPI_KEY=${SERPAPI_KEY:-}
      - BRAVE_SEARCH_API_KEY=${BRAVE_SEARCH_API_KEY:-}
      - BRAVE_API_KEY=${BRAVE_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - CRAWLER_CONCURRENCY=${CRAWLER_CONCURRENCY:-3}
      - CRAWLER_REQUEST_DELAY_MS=${CRAWLER_REQUEST_DELAY_MS:-1000}
      - CRAWLER_TIMEOUT_MS=${CRAWLER_TIMEOUT_MS:-15000}
    volumes:
      - huntly-data:/app/data
    env_file:
      - path: .env
        required: false

volumes:
  huntly-data:
    name: huntly_data
